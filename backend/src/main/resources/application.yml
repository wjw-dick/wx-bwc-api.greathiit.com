server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: bwc-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bwc}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: BwcHikariPool
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 20
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        auto-startup: ${BWC_MQ_LISTENER:false}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

bwc:
  jwt-secret: ${JWT_SECRET:bwc-campus-security-jwt-secret-key-please-change-in-production-2026}
  jwt-expire-hours: ${JWT_EXPIRE_HOURS:24}
  aes-key: ${AES_KEY:bwc-campus-security-aes-key-please-change-in-production-2026}
  upload-path: ${UPLOAD_PATH:./uploads}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  plate-timeout-seconds: ${PLATE_TIMEOUT_SECONDS:8}
  mq:
    listener-enabled: ${BWC_MQ_LISTENER:false}
  wechat:
    mp-app-id: ${WX_MP_APP_ID:}
    mp-app-secret: ${WX_MP_APP_SECRET:}
    mini-app-id: ${WX_MINI_APP_ID:}
    mini-app-secret: ${WX_MINI_APP_SECRET:}

logging:
  level:
    root: info
    com.greathiit.bwc: info
    com.greathiit.bwc.module: info
