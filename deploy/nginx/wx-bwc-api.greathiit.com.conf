# ============================================================================
# 校园保卫 SaaS · Nginx 站点配置（宝塔 / 裸机通用）
# 域名：wx-bwc-api.greathiit.com
# 前端：/admin/（Vue3 后台）、/h5/（公开门户）
# 后端：/api/ → 127.0.0.1:18088
# ============================================================================

upstream bwc_api {
    server 127.0.0.1:18088;
    keepalive 32;
}

server {
    listen 80;
    server_name wx-bwc-api.greathiit.com;

    # Certbot / 宝塔 ACME 验证目录
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/bwc/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name wx-bwc-api.greathiit.com;

    ssl_certificate     /www/server/panel/vhost/cert/wx-bwc-api.greathiit.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wx-bwc-api.greathiit.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 50m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    access_log /www/wwwlogs/wx-bwc-api.access.log;
    error_log  /www/wwwlogs/wx-bwc-api.error.log;

    # ---------------------------------------------------------------- 后台
    location = / {
        return 302 /admin/;
    }

    location /admin/ {
        alias /www/wwwroot/bwc/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------------------------------------------------------------- H5 门户
    location /h5/ {
        alias /www/wwwroot/bwc/h5/;
        index index.html;
        try_files $uri $uri/ /h5/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ---------------------------------------------------------------- 接口
    location /api/ {
        proxy_pass http://bwc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # 微信服务器回调（公众号/小程序）与接口共用
    location = /wechat/callback {
        proxy_pass http://bwc_api/api/wechat/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------- 上传文件
    location /uploads/ {
        alias /www/wwwroot/bwc/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        # 生产建议禁止脚本执行
        location ~* \.(php|jsp|sh|py)$ { deny all; }
    }

    # 健康检查
    location = /health {
        proxy_pass http://bwc_api/api/public/health;
        access_log off;
    }
}
