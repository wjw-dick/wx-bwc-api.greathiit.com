apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bwc
  namespace: bwc
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - wx-bwc-api.greathiit.com
      secretName: bwc-tls
  rules:
    - host: wx-bwc-api.greathiit.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bwc-web
                port:
                  number: 80
